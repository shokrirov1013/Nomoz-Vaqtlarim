name: Diag

# Manbalarni diagnostika qiladi; natijani `diag` branch'iga yozadi.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: muslim.uz tekshiruvi
        run: |
          set +e
          python3 voicepack/probe_muslim.py
          mkdir -p out
      - name: diag branch
        run: |
          mkdir -p "$RUNNER_TEMP/d" && cp -r out/. "$RUNNER_TEMP/d/"
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan diag; git rm -rf --cached . -q; git clean -fdxq
          cp -r "$RUNNER_TEMP/d/." .
          git add -A; git commit -qm "diag"; git push -f origin diag
